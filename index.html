<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>

    <div class="calculator">
        <h1>Calculator Project</h1>


        <input type="text" id="display" readonly>

        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">*</button>

            <button>0</button>
            <button>.</button>
            <button class="equals">=</button>
            <button class="operator">+</button>
            <hr>


            
            <h2>Version 1.0</h2>
        </div>
    </div>
    
</body>
</html>
